<script id="sim" type="x-shader">#version 300 es
precision highp float;
/* One small texture remembers what the mouse did. Each variant keeps something different in it. */
uniform sampler2D uF; uniform vec2 uRes,uFs; uniform vec4 uSeg,uWin; uniform vec3 uPulse[4]; uniform vec2 uVel; uniform float uDt,uT,uPress; uniform int uV; out vec4 o;
float seg(vec2 p,vec2 a,vec2 b){vec2 d=b-a;float t=clamp(dot(p-a,d)/max(dot(d,d),1e-4),0.,1.);return length(p-a-d*t);}
float h1(float x){return fract(sin(x*91.17)*4375.85);}
float n1(float x){float i=floor(x),f=fract(x);f*=f*(3.-2.*f);return mix(h1(i),h1(i+1.),f);}
bool inWin(vec2 p){return all(lessThan(abs(p-uWin.xy),uWin.zw));}
void main(){
  vec2 p=gl_FragCoord.xy/uFs*uRes; vec2 e=1./uFs, uv=gl_FragCoord.xy*e;
  vec4 f=texture(uF,uv); float d=seg(p,uSeg.xy,uSeg.zw);
  if(uV!=0){ /* Squares and Gradient: energy */
    float b=(texture(uF,uv+vec2(e.x,0.)).r+texture(uF,uv-vec2(e.x,0.)).r+texture(uF,uv+vec2(0.,e.y)).r+texture(uF,uv-vec2(0.,e.y)).r)*.25;
    float r=mix(f.r,b,.12)*exp(-uDt/1.1);
    r=max(r,uPress*exp(-d*d/(2.*95.*95.)));
    for(int i=0;i<4;i++){float a=uPulse[i].z;if(a>0.&&a<1.4)r=max(r,(1.-a/1.4)*.85*exp(-pow((length(p-uPulse[i].xy)-a*760.)/58.,2.)));}
    o=vec4(r,0.,0.,1.);
  }else{ /* Water: height and speed. The app window is a wall the ripples bounce off. */
    if(inWin(p)){o=vec4(0.,0.,0.,1.);return;}
    float sum=0.; vec2 off[4]=vec2[](vec2(1,0),vec2(-1,0),vec2(0,1),vec2(0,-1));
    for(int i=0;i<4;i++){vec2 q=p+off[i]/uFs*uRes; sum+=inWin(q)?f.r:texture(uF,uv+off[i]*e).r;}
    float v=f.g+(sum-4.*f.r)*.24; v*=.995; float h=mix(f.r+v,sum*.25,.035)*.9992;
    h-=uPress*exp(-d*d/(2.*17.*17.))*min(length(uVel)/1100.,1.)*.17;
    for(int i=0;i<4;i++){float a=uPulse[i].z;if(a>0.&&a<.1){float q=length(p-uPulse[i].xy);h-=exp(-q*q/(2.*24.*24.))*.07;
      /* A click in the Demo happens on the window, so it leaves from the window's edge. */
      vec2 w=abs(p-uWin.xy)-uWin.zw; float edge=length(max(w,0.));h-=inWin(uPulse[i].xy)?exp(-edge*edge/200.-q*q/(2.*420.*420.))*.06:0.;}}
    o=vec4(clamp(h,-1.5,1.5),clamp(v,-1.,1.),0.,1.);
  }
}</script>
<script id="show" type="x-shader">#version 300 es
precision highp float;
uniform sampler2D uA,uB,uF; uniform vec4 uCa,uCb; uniform vec2 uRes,uFs; uniform float uT,uMix,uDpr,uTa,uTb,uAmt,uCell; uniform bool uGa,uGb; uniform int uV;
uniform vec4 uBlob[8]; uniform vec3 uBc[8],uBase,uPal[4]; out vec4 o;
float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f*=f*(3.-2.*f);return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}
vec4 F(vec2 p){return texture(uF,p/uRes);}
/* Very large, soft, see-through circles. Warping the space they are measured in changes their shape. */
vec3 gradient(vec2 p){
  vec2 q=p/uRes.y*1.5; float t=uT*.06;
  vec2 w=vec2(noise(q+t),noise(q+vec2(7.3,-t)))-.5; w+=.5*(vec2(noise(q*2.1-t),noise(q*2.1+vec2(3.1,t*1.3)))-.5);
  p+=w*uRes.y*.34;
  vec3 c=uBase*uBase;
  for(int i=0;i<8;i++){vec2 d=(p-uBlob[i].xy)/uBlob[i].z;float a=uBlob[i].w*exp(-dot(d,d)*2.3);c=mix(c,uBc[i]*uBc[i],a);}
  c=sqrt(c); float l=dot(c,vec3(.3,.6,.1)); return clamp(mix(vec3(l),c,1.22),0.,1.);
}
/* What is behind everything at stage pixel p, averaged over about r pixels. m crossfades to the next one. */
vec3 pic(vec2 p,float r,float m){
  vec2 u=p/uRes; vec3 a=vec3(0),b=vec3(0),g=vec3(0);
  if((uGa&&m<1.)||(uGb&&m>0.))g=gradient(p);
  if(m<1.)a=uGa?g:textureLod(uA,u*uCa.xy+uCa.zw,log2(max(1.,r*uTa))).rgb;
  if(m>0.)b=uGb?g:textureLod(uB,u*uCb.xy+uCb.zw,log2(max(1.,r*uTb))).rgb;
  return mix(a,b,m);
}
vec3 blur(vec2 p,float r,float m){
  if(r<1.5||(uGa&&uGb))return pic(p,.5,m);
  vec3 c=vec3(0);float a=hash(p)*6.28;
  for(int i=0;i<12;i++){float q=sqrt((float(i)+.5)/12.);vec2 d=vec2(cos(a),sin(a))*q*r;c+=pic(p+d,r*.6,m);a+=2.39996;}
  return c/12.;
}
vec3 hsv(vec3 c){vec4 K=vec4(0,-1./3.,2./3.,-1);vec4 p=mix(vec4(c.bg,K.wz),vec4(c.gb,K.xy),step(c.b,c.g));vec4 q=mix(vec4(p.xyw,c.r),vec4(c.r,p.yzx),step(p.x,c.r));float d=q.x-min(q.w,q.y);return vec3(abs(q.z+(q.w-q.y)/(6.*d+1e-6)),d/(q.x+1e-6),q.x);}
vec3 rgb(vec3 c){vec3 p=abs(fract(c.xxx+vec3(1,2./3.,1./3.))*6.-3.);return c.z*mix(vec3(1),clamp(p-1.,0.,1.),c.y);}
float H(vec2 p){vec2 e=uRes/uFs;return F(p).r*.4+(F(p+vec2(e.x,0)).r+F(p-vec2(e.x,0)).r+F(p+vec2(0,e.y)).r+F(p-vec2(0,e.y)).r)*.15;}
/* 1 inside a square of half-size h around 0, with slightly rounded corners */
float box(vec2 q,float h,float r){vec2 d=abs(q)-h+r;return 1.-smoothstep(-.6,.6,length(max(d,0.))+min(max(d.x,d.y),0.)-r);}
/* Light catching the top-left edge of a pane, shade along the bottom-right, and a sheen across it */
float pane(vec2 q,float h){
  float tl=smoothstep(1.3,.2,min(q.x,q.y)+h),br=smoothstep(1.3,.2,h-max(q.x,q.y));
  float sheen=smoothstep(.9,-.7,(q.x+q.y)/(2.*h));
  return tl*.20+br*.07+sheen*.085;
}
/* Whether a square is lit. Each has its own clock; neighbours share a tide, so they gather in clumps. */
float lit(vec2 id,float density){
  float tide=noise(id*.27+vec2(uT*.05,-uT*.035))*.75+noise(id*.09-uT*.02)*.5;
  float k=uT*.22+hash(id)*9.; float a=floor(k),f=smoothstep(.0,.16,fract(k));
  float was=step(hash(id+(a-1.)*1.37),(tide-.28)*density),is=step(hash(id+a*1.37),(tide-.28)*density);
  return mix(was,is,f);
}
vec3 colour(vec2 id,float k){float h=noise(id*.19+k*3.+31.)+.22*(hash(id+k)-.5);return h<.42?uPal[0]:h<.6?uPal[1]:h<.68?uPal[2]:uPal[3];}
void main(){
  vec2 p=gl_FragCoord.xy/uDpr; p.y=uRes.y-p.y; vec3 c;
  float soft=clamp(uMix*1.6-noise(p/210.)*.6,0.,1.);
  float s=uCell; vec2 org=mod(uRes*.5,s)-s;
  if(uV==0){ /* Water */
    vec2 e=vec2(4.5,0); float x1=H(p-e.xy),x2=H(p+e.xy),y1=H(p-e.yx),y2=H(p+e.yx),h=H(p);
    vec2 n=vec2(x2-x1,y2-y1);
    vec2 t=p/170.; vec2 swell=vec2(noise(t+uT*.22)-noise(t+vec2(.35,0)+uT*.22),noise(t+uT*.22)-noise(t+vec2(0,.35)+uT*.22));
    n+=swell*.10; n*=uAmt;
    vec2 r=clamp(n*240.,-90.,90.);
    c.r=pic(p-r*1.07,1.,soft).r;c.g=pic(p-r,1.,soft).g;c.b=pic(p-r*.93,1.,soft).b;
    float lap=(x1+x2+y1+y2-4.*h)*uAmt; c*=1.+clamp(-lap*2.6,-.3,.6);
    vec3 N=normalize(vec3(-n*5.,1.)),L=normalize(vec3(-.45,-.6,.55)); float sp=pow(max(dot(reflect(-L,N),vec3(0,0,1)),0.),26.);
    c+=min(sp,.75)*.2;
  }else if(uV==1){ /* Glass squares: the photo, with loose tinted panes of frosted glass over it */
    vec2 id=floor((p-org)/s),ct=(id+.5)*s+org,q=p-ct; float en=F(ct).r,h=s*.5-1.5;
    float m=smoothstep(0.,.25,uMix*1.25-hash(id+3.));
    float on=max(lit(id,.62*uAmt),smoothstep(.0,.22,en-hash(id+2.)*.62));
    float edge=box(q,h,3.);
    vec3 back=pic(p,1.,soft)*.86;
    vec3 in_=blur(p-q*.25,s*.8,m);
    vec3 tint=colour(id,floor(uT*.05+hash(id+6.)));
    tint=mix(tint,uPal[int(mod(hash(id+12.)*4.+en*3.,4.))],smoothstep(.25,.7,en));
    float v=hash(id+8.); float strength=mix(v<.45?mix(.06,.30,v/.45):mix(.45,.82,(v-.45)/.55),.34,smoothstep(.5,.95,en));
    /* Tint as glass would: multiply by the colour, then lay some of it on top */
    vec3 g=mix(in_,in_*(.45+tint*.95)+tint*.12,.8); g=mix(g,tint,strength);
    g+=pane(q,h)*mix(1.,1.4,en);
    c=mix(back,g,edge*on);
    
  }else if(uV==2){ /* Mosaic: the photo is nothing but panes, which split near the mouse */
    s*=2.; org=mod(uRes*.5,s)-s; vec2 id0=floor((p-org)/s);
    float m=smoothstep(0.,.25,uMix*1.25-hash(id0+3.));
    float th[3]=float[](.08,.30,.56),big=1.; vec2 id=id0,ct; float en;
    for(int i=0;i<3;i++){
      id=floor((p-org)/s);ct=(id+.5)*s+org;en=F(ct).r;
      float h=hash(id+s); float own=i==0?.34:i==1?.12:0.;
      if(en+(h-.5)*.12*step(.03,en)<th[i]&&h>own)break;
      s*=.5;big*=.66;
      id=floor((p-org)/s);ct=(id+.5)*s+org;en=F(ct).r;
    }
    vec2 q=p-ct; float h=s*.5-.5;
    float a=hash(id+s*1.7),b=hash(id+s*2.3+5.),d=hash(id+s*3.1+11.),w=hash(id+s*4.7+17.);
    float tw=sin(uT*(.35+b*.5)+a*40.);
    vec3 sq=mix(pic(ct,s*.6,m),blur(p-q*.4,s*.42,m),.6),z=hsv(sq);
    z.x+=((a-.5)*.10*big+tw*.010+en*(1.-en)*(b-.5)*.6)*uAmt;
    z.y=clamp(z.y*(1.+(b-.5)*.6*uAmt)+en*.14,0.,1.);
    z.z=clamp(z.z*(1.+((d-.5)*.5*big+tw*.04)*uAmt)+en*(1.-en)*.14,0.,1.);
    vec3 g=rgb(z); if(w>.86)g=mix(g,colour(id0,0.),.45*big*uAmt);
    g+=pane(q,h)*.45*smoothstep(10.,40.,s);
    c=mix(pic(p,1.,m),g,1.-smoothstep(.66,.96,en));
  }else if(uV==3){ /* Lit squares: dark wall, the photo only exists inside the squares */
    vec2 id=floor((p-org)/s),ct=(id+.5)*s+org,q=p-ct; float en=F(ct).r;
    float m=smoothstep(0.,.25,uMix*1.25-hash(id+3.));
    vec3 avg=pic(ct,s*.8,m); float lum=dot(avg,vec3(.3,.6,.1));
    float near=smoothstep(.02,.35,en-hash(id+2.)*.30);
    float on=max(lit(id,(.5+min(lum,.5)*.75)*uAmt),near);
    float open=smoothstep(.45,.9,en); float h=s*.5-mix(1.5,.0,open);
    vec3 z=hsv(avg); z.y=min(1.,z.y*1.35+.06); z.z=clamp(z.z*1.18+.12+(hash(id+9.)-.5)*.22,0.,1.);
    vec3 flat_=rgb(z); float k=noise(id*.21+40.)+.2*(hash(id+4.)-.5);
    if(k>.66)flat_=mix(flat_,uPal[1],.85); else if(k<.24)flat_=mix(flat_,uPal[2],.8);
    vec3 g=mix(flat_,mix(flat_,blur(p-q*.3,s*.3,m)*1.15,.35),.8)+pane(q,s*.5-1.5)*.6;
    g=mix(g,pic(p,1.,m),smoothstep(.3,.75,en));
    float dim=mix(1.,.28,step(.86,hash(id+21.+floor(uT*.22+hash(id)*9.))));
    c=mix(vec3(.043),g,box(q,h,mix(2.,0.,open))*on*mix(dim,1.,near));
  }else{ /* Gradient */
    vec2 j=vec2(hash(floor(p)),hash(floor(p)+31.))-.5; float en=F(p).r;
    c=gradient(p+j*16.);
    vec3 z=hsv(c); z.y=min(1.,z.y*(1.+en*.22)); z.z=min(1.,z.z*(1.+en*.10)); c=rgb(z);
    c+=(hash(p+3.)-.5)*.035*uAmt;
  }
  o=vec4(c+(hash(p+fract(uT))-.5)/255.,1.);
}</script>
<script>
const $=(id)=>document.getElementById(id);
const VARIANTS=[
  {name:"A: Water",tip:"Move to ripple, click to drop."},
  {name:"B: Glass squares",tip:"Panes light up around you. Click for a wave."},
  {name:"C: Mosaic",tip:"Panes split as you get close. Click for a wave."},
  {name:"D: Lit squares",tip:"The photo only shows where squares are lit."},
  {name:"E: Gradient",tip:"The blobs drift towards you. Click to push them."},
];
/* base, then the colours the blobs and squares are made of. Photos have a matching set. */
const LOOKS={
  spring:{name:"Spring",base:"#bfe3ea",c:["#0aa6b8","#7aa7ff","#f7d3e6","#0b4f7d","#45e3d0","#a594ff"]},
  aurora:{name:"Aurora",base:"#04211f",c:["#19d68c","#5f86ff","#ff9a76","#077a66","#a8ffd0","#3b4fd6"]},
  canyon:{name:"Canyon",base:"#ffd9c2",c:["#ff6a26","#8aa2ff","#ffb02e","#d8431c","#ffc2a3","#ff7fae"]},
  bloom:{name:"Bloom",base:"#fbf3f5",c:["#f0607c","#f6a6cf","#ffb08a","#c9b3ff","#ff7a59","#fbd3e4"]},
  yellow:{name:"KeyClip",base:"#ffc400",c:["#ffd000","#ff7a1a","#fff0a0","#ff9d00","#ffe14d","#ff5470"]},
};
const ORDER=Object.keys(LOOKS), PHOTO=["spring","aurora","canyon"], FOCUS={spring:[.5,.6],aurora:[.5,.5],canyon:[.5,.45]};
const photoFor=()=>choice||(variant===4?["spring","bloom","aurora","yellow","canyon","bloom"][index]:PHOTO[index%3]);
const isGrad=n=>variant===4||!PHOTO.includes(n);
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255);
const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
let variant=Math.max(0,"abcde".indexOf(new URLSearchParams(location.search).get("v")||"a")), choice=null;

/* ---- the site, with the real Demos ---- */
let index=0,paused=false;
$("tagline").textContent=KC.TAGLINE;$("ask").href=KC.SURVEY_URL;
$("list").innerHTML=KC.FEATURES.map(f=>`<li><button class="item"><span class="ico">${KC.FEATURE_ICON[f.id]}</span><span class="txt"><b>${f.title}</b><span>${f.description}</span></span></button></li>`).join("");
const items=[...document.querySelectorAll(".item")];
const player=new KC.DemoPlayer($("view"),{isPhone:()=>false,reducedMotion:still,onProgress:v=>$("site").style.setProperty("--p",v.toFixed(4)),onEnd:()=>select(index+1)});
function select(i){
  index=(i+KC.FEATURES.length)%KC.FEATURES.length;
  items.forEach((el,k)=>{el.classList.toggle("on",k===index);el.querySelector(".highlight")?.remove();if(k===index)el.insertAdjacentHTML("afterbegin",'<span class="highlight" style="border-radius:16px"><i></i></span>')});
  player.play(index);
  wantPhoto(photoFor());
}
items.forEach((el,i)=>el.onclick=()=>select(i));
new ResizeObserver(()=>player.refit()).observe($("view"));
document.addEventListener("visibilitychange",()=>player.hold("hidden",document.hidden));
$("view").addEventListener("pointerover",e=>{const on=!!e.target.closest(".win");player.hold("hover",on);$("pause").textContent=paused?"Play":on?"Paused while you look":"Pause"});
$("view").addEventListener("pointerleave",()=>{player.hold("hover",false);$("pause").textContent=paused?"Play":"Pause"});
$("pause").onclick=()=>{paused=!paused;player.hold("user",paused);$("pause").textContent=paused?"Play":"Pause"};

/* ---- WebGL ---- */
const cv=$("gl"),gl=cv.getContext("webgl2",{antialias:false,alpha:false});
const ok=gl&&(gl.getExtension("EXT_color_buffer_float")||gl.getExtension("EXT_color_buffer_half_float"));
const tex={},size={};let cur=null,next=null,mixT=0,pending=null;
function fallback(n){if(!PHOTOS[n])return;$("bg").style.backgroundImage=`url(${PHOTOS[n]})`}
function wantPhoto(n){if(!ok)return fallback(n);pending=null;if(PHOTO.includes(n)&&!tex[n]){pending=n;return}if(!cur){cur=n;return}if(n===cur&&!next)return;if(next){cur=next;mixT=0}next=n===cur?null:n;mixT=0}
let sim,show,fb=[],W=0,H=0,fw=0,fh=0,dpr=1;
function prog(id){const mk=(t,s)=>{const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw new Error(id+": "+gl.getShaderInfoLog(o));return o};
  const p=gl.createProgram();gl.attachShader(p,mk(gl.VERTEX_SHADER,"#version 300 es\nvoid main(){vec2 p=vec2(gl_VertexID&1,gl_VertexID>>1)*4.-1.;gl_Position=vec4(p,0,1);}"));gl.attachShader(p,mk(gl.FRAGMENT_SHADER,$(id).textContent.trim()));gl.linkProgram(p);
  const loc={};return{p,u:n=>loc[n]??=gl.getUniformLocation(p,n)}}
function target(w,h){const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA16F,w,h,0,gl.RGBA,gl.HALF_FLOAT,null);for(const k of[gl.TEXTURE_MIN_FILTER,gl.TEXTURE_MAG_FILTER])gl.texParameteri(gl.TEXTURE_2D,k,gl.LINEAR);for(const k of[gl.TEXTURE_WRAP_S,gl.TEXTURE_WRAP_T])gl.texParameteri(gl.TEXTURE_2D,k,gl.CLAMP_TO_EDGE);
  const f=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,f);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0);gl.clearColor(0,0,0,1);gl.clear(gl.COLOR_BUFFER_BIT);return{t,f}}
function clearField(){fb.forEach(b=>{gl.bindFramebuffer(gl.FRAMEBUFFER,b.f);gl.clearColor(0,0,0,1);gl.clear(gl.COLOR_BUFFER_BIT)})}
function resize(){const r=$("stage").getBoundingClientRect();if(r.width===W&&r.height===H)return;W=r.width;H=r.height;dpr=Math.min(devicePixelRatio||1,1.5);cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  fw=360;fh=Math.round(360*H/W);fb.forEach(b=>{gl.deleteTexture(b.t);gl.deleteFramebuffer(b.f)});fb=[target(fw,fh),target(fw,fh)]}
/* background-size: cover, as scale and offset */
function cover(n){if(!size[n])return[1,1,0,0];const[iw,ih]=size[n],a=W/H,b=iw/ih;let sx=1,sy=1;if(a>b)sy=b/a;else sx=a/b;sx*=.95;sy*=.95;return[sx,sy,(1-sx)*FOCUS[n][0],(1-sy)*FOCUS[n][1]]}

/* pointer, in stage pixels */
const m={x:-999,y:-999,px:-999,py:-999,in:false,last:-1e9,lx:.5,ly:.3};let pulses=[];
$("stage").addEventListener("pointermove",e=>{const r=$("stage").getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;if(!m.in){m.px=x;m.py=y}m.x=x;m.y=y;m.in=true;m.last=performance.now()});
$("stage").addEventListener("pointerleave",()=>{m.in=false});
$("stage").addEventListener("pointerdown",e=>{if(e.target.closest("button,a"))return;const r=$("stage").getBoundingClientRect();pulse(e.clientX-r.left,e.clientY-r.top)});
function pulse(x,y){pulses.unshift({x,y,t:performance.now()});pulses.length=Math.min(pulses.length,4)}
/* A click made by the Demo's own cursor moves the background too. */
new MutationObserver(l=>l.forEach(r=>{const el=r.target;if(el.classList.contains("cur")&&el.classList.contains("dn")&&!(r.oldValue||"").includes("dn")){const a=el.getBoundingClientRect(),s=$("stage").getBoundingClientRect();pulse(a.left-s.left,a.top-s.top)}})).observe($("view"),{subtree:true,attributes:true,attributeFilter:["class"],attributeOldValue:true});

/* Gradient: eight big circles, each on its own slow path, leaning towards the mouse. Colours drift round the set. */
const B8=[...Array(8)].map((_,i)=>({x:0,y:0,ox:0,oy:0,vx:0,vy:0,a:i*.785+.4,k:.5+((i*37)%10)/14,c:[.5,.5,.5]}));let base=null;
const pal=[...Array(4)].map(()=>[0,0,0]);
function blobs(t,dt,awake){
  const L=LOOKS[next||cur],C=L.c.map(hex),e=1-Math.exp(-dt*1.6),toward=(v,w)=>v.forEach((x,i)=>v[i]+=(w[i]-x)*(cut?1:e)),cut=!base;
  base??=hex(L.base);toward(base,hex(L.base));pal.forEach((v,i)=>toward(v,C[i]));
  const S=Math.max(W,H),amt=+$("amt").value,pos=[],col=[],T=still?3:t;
  B8.forEach((b,i)=>{
    const x=W*(.5+.47*Math.cos(b.a+T*.055*b.k*amt)),y=H*(.55+.5*Math.sin(b.a*1.7+T*.07*b.k*amt)),r=S*(.25+.13*b.k)*(1+.2*Math.sin(T*.17*b.k+i*2.1));
    let fx=-b.ox*1.6,fy=-b.oy*1.6;
    if(awake){const dx=m.lx-x-b.ox,dy=m.ly-y-b.oy,d=Math.hypot(dx,dy)+1,g=Math.exp(-d*d/(2*(S*.34)**2));fx+=dx*g*3.4;fy+=dy*g*3.4}
    pulses.forEach(q=>{const age=(performance.now()-q.t)/1000;if(age<.35){const dx=x+b.ox-q.x,dy=y+b.oy-q.y,d=Math.hypot(dx,dy)+60,g=Math.exp(-d*d/(2*(S*.4)**2));fx+=dx/d*g*2600;fy+=dy/d*g*2600}});
    b.vx=(b.vx+fx*dt)*Math.exp(-dt*1.5);b.vy=(b.vy+fy*dt)*Math.exp(-dt*1.5);b.ox+=b.vx*dt;b.oy+=b.vy*dt;
    const q=i+T*.05,n=C.length,k=Math.floor(q)%n,f=q%1,w=f*f*(3-2*f);toward(b.c,C[k].map((v,j)=>v+(C[(k+1)%n][j]-v)*w));
    pos.push(x+b.ox,y+b.oy,r,.78+.16*Math.sin(T*.11+i));col.push(...b.c)});
  gl.uniform4fv(show.u("uBlob"),pos);gl.uniform3fv(show.u("uBc"),col);gl.uniform3fv(show.u("uBase"),base);gl.uniform3fv(show.u("uPal"),pal.flat());
}
let last=performance.now(),acc=0,win=[-1e4,-1e4,1,1],ghost=0,gx=0,gy=0;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(now-last)/1000);last=now;resize();
  if(pending&&tex[pending]){const n=pending;pending=null;wantPhoto(n)}
  if(!cur)return;
  if(next){mixT+=dt/(still?.01:1.1);if(mixT>=1){cur=next;next=null;mixT=0}}
  const wb=$("view").querySelector(".win:not(.out-swap)")?.getBoundingClientRect(),sb=$("stage").getBoundingClientRect();
  if(wb)win=[wb.left-sb.left+wb.width/2,wb.top-sb.top+wb.height/2,wb.width/2,wb.height/2];
  /* Nobody moving the mouse: a slow, fainter pass around the edge keeps it alive. */
  const idle=!still&&now-m.last>5000;ghost+=dt*.32;
  let a=[m.px,m.py,m.x,m.y],press=m.in&&!idle?1:0;
  if(idle){const x=W/2+Math.cos(ghost)*W*.44,y=H*.45+Math.sin(ghost*1.6)*H*.4;a=[gx||x,gy||y,x,y];gx=x;gy=y;press=variant===0?1:.55}else gx=gy=0;
  const vx=(a[2]-a[0])/Math.max(dt,.004),vy=(a[3]-a[1])/Math.max(dt,.004);
  m.px=m.x;m.py=m.y;
  const lx=idle?a[2]:m.in?m.x:W*.5,ly=idle?a[3]:m.in?m.y:H*.3;m.lx+=(lx-m.lx)*Math.min(1,dt*7);m.ly+=(ly-m.ly)*Math.min(1,dt*7);
  gl.useProgram(sim.p);gl.viewport(0,0,fw,fh);gl.activeTexture(gl.TEXTURE0);
  gl.uniform1i(sim.u("uF"),0);gl.uniform2f(sim.u("uRes"),W,H);gl.uniform2f(sim.u("uFs"),fw,fh);gl.uniform1f(sim.u("uT"),now/1000);gl.uniform1i(sim.u("uV"),variant);gl.uniform1f(sim.u("uPress"),press);gl.uniform4f(sim.u("uWin"),...win);gl.uniform2f(sim.u("uVel"),vx,vy);
  for(let i=0;i<4;i++){const q=pulses[i];gl.uniform3f(sim.u(`uPulse[${i}]`),q?q.x:0,q?q.y:0,q?(now-q.t)/1000+.001:-1)}
  const h=1/180;acc=Math.min(acc+dt,h*8);const n=Math.floor(acc/h);acc-=n*h;
  for(let i=0;i<n;i++){const f=k=>a[k]+(a[k+2]-a[k])*(i/n),g=k=>a[k]+(a[k+2]-a[k])*((i+1)/n);
    gl.uniform4f(sim.u("uSeg"),f(0),f(1),g(0),g(1));gl.uniform1f(sim.u("uDt"),h);
    gl.bindTexture(gl.TEXTURE_2D,fb[0].t);gl.bindFramebuffer(gl.FRAMEBUFFER,fb[1].f);gl.drawArrays(gl.TRIANGLES,0,3);fb.reverse()}
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,cv.width,cv.height);gl.useProgram(show.p);
  const B=next||cur,ca=cover(cur),cb=cover(B);
  const any=tex.spring||tex.aurora||tex.canyon;[[0,tex[cur]||any,"uA"],[1,tex[B]||any,"uB"],[2,fb[0].t,"uF"]].forEach(([i,t,u])=>{gl.activeTexture(gl.TEXTURE0+i);gl.bindTexture(gl.TEXTURE_2D,t);gl.uniform1i(show.u(u),i)});
  blobs(now/1000,dt,idle||m.in);
  gl.uniform4f(show.u("uCa"),...ca);gl.uniform4f(show.u("uCb"),...cb);gl.uniform1f(show.u("uTa"),(size[cur]?.[0]||W)*ca[0]/W);gl.uniform1f(show.u("uTb"),(size[B]?.[0]||W)*cb[0]/W);gl.uniform1i(show.u("uGa"),isGrad(cur));gl.uniform1i(show.u("uGb"),isGrad(B));gl.uniform1f(show.u("uCell"),+$("cell").value);
  gl.uniform2f(show.u("uRes"),W,H);gl.uniform2f(show.u("uFs"),fw,fh);gl.uniform1f(show.u("uT"),still?0:now/1000);gl.uniform1f(show.u("uMix"),next?mixT:0);gl.uniform1f(show.u("uDpr"),dpr);gl.uniform1f(show.u("uAmt"),+$("amt").value);gl.uniform1i(show.u("uV"),variant);
  gl.drawArrays(gl.TRIANGLES,0,3);
}

/* ---- controls ---- */
function pills(id,names,on){$(id).innerHTML=names.map(n=>`<button>${n}</button>`).join("");const b=[...$(id).children];const set=i=>{b.forEach((x,k)=>x.setAttribute("aria-pressed",k===i));on(i)};b.forEach((x,i)=>x.onclick=()=>set(i));return set}
const setV=pills("variants",VARIANTS.map(v=>v.name),i=>{variant=i;$("tip").textContent=VARIANTS[i].tip;pulses=[];$("cellbox").hidden=i===0||i===4;if(fb.length)clearField();wantPhoto(photoFor())});
const setP=pills("photos",["Per Feature",...ORDER.map(n=>LOOKS[n].name)],i=>{choice=i?ORDER[i-1]:null;wantPhoto(photoFor())});
addEventListener("keydown",e=>{if(e.target.tagName!=="INPUT"&&"12345".includes(e.key))setV(e.key-1)});
if(ok){sim=prog("sim");show=prog("show");gl.bindVertexArray(gl.createVertexArray());
  PHOTO.forEach(n=>{const im=new Image();im.onload=()=>{const t=gl.createTexture();gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,t);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,im);gl.generateMipmap(gl.TEXTURE_2D);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);for(const k of[gl.TEXTURE_WRAP_S,gl.TEXTURE_WRAP_T])gl.texParameteri(gl.TEXTURE_2D,k,gl.MIRRORED_REPEAT);size[n]=[im.width,im.height];tex[n]=t};im.src=PHOTOS[n]});
}else cv.remove();
setV(variant);setP(0);select(0);
if(ok)requestAnimationFrame(frame);
</script>
